  <script src="main.js"></script>
  <script>
    // Simple, zero-dependency Markdown parser for clean blog posts
    function renderMarkdown(md) {
      let html = md
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks ```...```
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
        return '<pre class="prose-code"><code>' + code.trim() + "</code></pre>";
      });

      const lines = html.split("\n");
      const out = [];
      let inList = false;
      let listType = "ul";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (!line) {
          if (inList) {
            out.push("</" + listType + ">");
            inList = false;
          }
          continue;
        }

        if (line.startsWith('<pre class="prose-code">')) {
          if (inList) {
            out.push("</" + listType + ">");
            inList = false;
          }
          out.push(line);
          continue;
        }

        if (line.startsWith("### ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<h3>" + formatInline(line.slice(4)) + "</h3>");
        } else if (line.startsWith("## ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<h2>" + formatInline(line.slice(3)) + "</h2>");
        } else if (line.startsWith("- ")) {
          if (!inList || listType !== "ul") {
            if (inList) out.push("</" + listType + ">");
            out.push("<ul>");
            inList = true;
            listType = "ul";
          }
          out.push("<li>" + formatInline(line.slice(2)) + "</li>");
        } else if (/^\d+\.\s+/.test(line)) {
          if (!inList || listType !== "ol") {
            if (inList) out.push("</" + listType + ">");
            out.push("<ol>");
            inList = true;
            listType = "ol";
          }
          out.push("<li>" + formatInline(line.replace(/^\d+\.\s+/, "")) + "</li>");
        } else if (line.startsWith("&gt; ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<blockquote>" + formatInline(line.slice(5)) + "</blockquote>");
        } else {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<p>" + formatInline(line) + "</p>");
        }
      }
      if (inList) out.push("</" + listType + ">");
      return out.join("\n");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      if (!slug) {
        document.getElementById("post-title").textContent = "Post not found";
        return;
      }

      try {
        const [indexRes, mdRes] = await Promise.all([
          fetch("posts/index.json?t=" + Date.now()),
          fetch("posts/" + encodeURIComponent(slug) + ".md?t=" + Date.now())
        ]);

        const posts = await indexRes.json();
        const meta = posts.find((p) => p.slug === slug);
        const md = await mdRes.text();

        if (meta) {
          document.title = meta.title + " | AiPRIL";
          document.getElementById("post-title").textContent = meta.title;
          document.getElementById("post-category").textContent = meta.category.toUpperCase();
          document.getElementById("post-date").textContent = meta.date;
          document.getElementById("post-readtime").textContent = meta.readTime || "3 min read";
          document.getElementById("post-summary").textContent = meta.summary || "";
          document.getElementById("edit-post-link").href = "studio.html?edit=" + encodeURIComponent(slug);
        }

        document.getElementById("post-body").innerHTML = renderMarkdown(md);
      } catch (err) {
        document.getElementById("post-title").textContent = "Could not load article.";
      }
    }

    loadArticle();
  </script>
</body>
</html>
