      if (host !== "localhost" && host !== "127.0.0.1") {

        var slug = params.get("slug");
        if (slug && /^[a-z0-9-]+$/i.test(slug)) {
          window.location.replace("/writing/" + encodeURIComponent(slug) + "/");
        }
      }
    })();

<body>

  <script src="analytics-config.js"></script>
  <script src="analytics.js"></script>
  <script src="main.js"></script>
  <script>
    function lowerPreserveBrand(str) {
      return String(str || "").toLowerCase().replace(/aipril/gi, "AiPRIL");
    }

    function renderMarkdown(md) {
      const codeBlocks = [];
      let safe = lowerPreserveBrand(md)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      safe = safe.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, _lang, code) {
        const token = "@@codeblock_" + codeBlocks.length + "@@";
        codeBlocks.push('<pre class="prose-code"><code>' + code.trim() + "</code></pre>");
        return "\n" + token + "\n";
      });

      const lines = safe.split("\n");
      const out = [];
      let inList = false;
      let listType = "ul";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          continue;
        }
        const codeMatch = line.match(/^@@codeblock_(\d+)@@$/);
        if (codeMatch) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push(codeBlocks[Number(codeMatch[1])]);
          continue;
        }
        if (line.startsWith("### ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<h3>" + formatInline(line.slice(4)) + "</h3>");
        } else if (line.startsWith("## ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<h2>" + formatInline(line.slice(3)) + "</h2>");
        } else if (line.startsWith("- ")) {
          if (!inList || listType !== "ul") {
            if (inList) out.push("</" + listType + ">");
            out.push("<ul>"); inList = true; listType = "ul";
          }
          out.push("<li>" + formatInline(line.slice(2)) + "</li>");
        } else if (/^\d+\.\s+/.test(line)) {
          if (!inList || listType !== "ol") {
            if (inList) out.push("</" + listType + ">");
            out.push("<ol>"); inList = true; listType = "ol";
          }
          out.push("<li>" + formatInline(line.replace(/^\d+\.\s+/, "")) + "</li>");
        } else if (line.startsWith("&gt; ")) {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<blockquote>" + formatInline(line.slice(5)) + "</blockquote>");
        } else {
          if (inList) { out.push("</" + listType + ">"); inList = false; }
          out.push("<p>" + formatInline(line) + "</p>");
        }
      }
      if (inList) out.push("</" + listType + ">");
      return out.join("\n");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      if (!slug) {
        document.getElementById("post-title").textContent = "post not found";
        return;
      }
      const canonicalEl = document.getElementById("canonical-link");
      if (canonicalEl) {
        canonicalEl.href = "https://iced-latte.com/writing/" + encodeURIComponent(slug) + "/";
      }
      try {
        const [indexRes, mdRes] = await Promise.all([
          fetch("posts/index.json?t=" + Date.now()),
          fetch("posts/" + encodeURIComponent(slug) + ".md?t=" + Date.now())
        ]);
        if (!mdRes.ok) throw new Error("Not found");
        const posts = await indexRes.json();
        const meta = posts.find(function (p) { return p.slug === slug; });
        const md = await mdRes.text();
        if (meta) {
          const titleLower = lowerPreserveBrand(meta.title);
          document.title = titleLower + " | AiPRIL";
          document.getElementById("post-title").textContent = titleLower;
          document.getElementById("post-category").textContent = lowerPreserveBrand(meta.category);
          document.getElementById("post-date").textContent = meta.date;
          document.getElementById("post-readtime").textContent = lowerPreserveBrand(meta.readTime || "3 min read");
          document.getElementById("post-summary").textContent = lowerPreserveBrand(meta.summary || "");
          document.getElementById("edit-post-link").href = "studio.html?edit=" + encodeURIComponent(slug);
        }
        document.getElementById("post-body").innerHTML = renderMarkdown(md);
      } catch (_err) {
        document.getElementById("post-title").textContent = "could not load article.";
      }
    }

    loadArticle();
  </script>
</body>
</html>
