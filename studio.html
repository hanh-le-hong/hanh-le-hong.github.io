<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>cms studio | AiPRIL</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a href="index.html" class="brand" aria-label="AiPRIL home">
            <span>AiPRIL</span>
            <span class="studio-badge">studio</span>
          </a>
          <nav class="header-nav">
            <a href="index.html" class="nav-link">&lt;- view website</a>
          </nav>
        </div>

        <div class="header-right">
          <button id="theme-toggle" class="season-switch" type="button">
            <span class="season-opt" data-season="winter">winter</span>
            <span class="season-sep">/</span>
            <span class="season-opt" data-season="spring">spring</span>
          </button>
        </div>
      </div>
    </header>

    <main class="studio-main">
      <div class="container studio-layout">
        <aside class="studio-sidebar">
          <div class="studio-sidebar-head">
            <span class="tag">all posts</span>
            <button id="new-post-btn" class="btn-solid btn-sm" type="button">+ new</button>
          </div>
          <div id="studio-post-list" class="studio-post-list"></div>
        </aside>

        <section class="studio-editor">
          <div class="studio-form-row">
            <div class="studio-field">
              <label for="f-title">title</label>
              <input id="f-title" type="text" placeholder="e.g. why i'm learning sql as a marketer" />
            </div>
          </div>

          <div class="studio-form-grid">
            <div class="studio-field">
              <label for="f-slug">url slug (auto)</label>
              <input id="f-slug" type="text" placeholder="why-im-learning-sql" />
            </div>
            <div class="studio-field">
              <label for="f-category">pillar / category</label>
              <select id="f-category">
                <option value="the craft">01 / the craft (work &amp; marketing)</option>
                <option value="the lab">02 / the lab (90-9-1 builds &amp; ai)</option>
                <option value="the human">03 / the human (life, chess, travel)</option>
              </select>
            </div>
            <div class="studio-field">
              <label for="f-date">date</label>
              <input id="f-date" type="date" />
            </div>
          </div>

          <div class="studio-field">
            <label for="f-summary">one-sentence summary (shown on homepage)</label>
            <input id="f-summary" type="text" placeholder="a short, honest summary in one sentence." />
          </div>

          <div class="studio-field">
            <div class="editor-toolbar">
              <label for="f-body">content (markdown)</label>
              <span class="toolbar-hint">use <code>## heading</code>, <code>**bold**</code>, <code>*italic*</code>, <code>- list</code>, <code>[link](https://...)</code></span>
            </div>
            <textarea id="f-body" rows="16" placeholder="write your thoughts honestly here..."></textarea>
          </div>

          <div class="studio-actions">
            <button id="publish-btn" class="btn-solid" type="button">publish / save post</button>
            <button id="download-md-btn" class="btn-ghost" type="button">download .md</button>
            <span id="studio-status" class="studio-status"></span>
          </div>
        </section>

        <section class="studio-preview">
          <div class="studio-sidebar-head">
            <span class="tag">live preview</span>
            <a id="open-post-link" href="#" target="_blank" class="mono-date" style="display:none;">open page ↗</a>
          </div>
          <div class="preview-canvas">
            <span id="p-category" class="tag">the craft</span>
            <h2 id="p-title" class="preview-title">your post title</h2>
            <p id="p-summary" class="preview-summary"></p>
            <div id="p-body" class="article-prose"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
  <script>
    const titleEl = document.getElementById("f-title");
    const slugEl = document.getElementById("f-slug");
    const catEl = document.getElementById("f-category");
    const dateEl = document.getElementById("f-date");
    const summaryEl = document.getElementById("f-summary");
    const bodyEl = document.getElementById("f-body");
    const statusEl = document.getElementById("studio-status");
    const postListEl = document.getElementById("studio-post-list");
    const openPostLink = document.getElementById("open-post-link");

    let allPosts = [];
    let slugManuallyEdited = false;

    dateEl.value = new Date().toISOString().slice(0, 10);

    function lowerPreserveBrand(str) {
      return String(str || "").toLowerCase().replace(/aipril/gi, "AiPRIL");
    }

    function slugify(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function estimateReadTime(text) {
      const words = text.trim().split(/\s+/).filter(Boolean).length;
      const mins = Math.max(1, Math.round(words / 200));
      return mins + " min read";
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    }

    function renderPreviewMarkdown(md) {
      let html = lowerPreserveBrand(md).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const lines = html.split("\n");
      const out = [];
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith("### ")) out.push("<h3>" + formatInline(line.slice(4)) + "</h3>");
        else if (line.startsWith("## ")) out.push("<h2>" + formatInline(line.slice(3)) + "</h2>");
        else if (line.startsWith("- ")) out.push("<ul><li>" + formatInline(line.slice(2)) + "</li></ul>");
        else out.push("<p>" + formatInline(line) + "</p>");
      }
      return out.join("\n");
    }

    function updatePreview() {
      document.getElementById("p-category").textContent = lowerPreserveBrand(catEl.value);
      document.getElementById("p-title").textContent = lowerPreserveBrand(titleEl.value) || "your post title";
      document.getElementById("p-summary").textContent = lowerPreserveBrand(summaryEl.value) || "";
      document.getElementById("p-body").innerHTML = renderPreviewMarkdown(bodyEl.value);
    }

    titleEl.addEventListener("input", () => {
      if (!slugManuallyEdited) {
        slugEl.value = slugify(titleEl.value);
      }
      updatePreview();
    });

    slugEl.addEventListener("input", () => {
      slugManuallyEdited = true;
    });

    [catEl, summaryEl, bodyEl].forEach((el) => el.addEventListener("input", updatePreview));

    async function loadPostList() {
      try {
        const res = await fetch("posts/index.json?t=" + Date.now());
        allPosts = await res.json();
        postListEl.innerHTML = allPosts
          .map(
            (p) => `
          <div class="studio-post-item" data-slug="${p.slug}">
            <div class="studio-post-item-title">${lowerPreserveBrand(p.title)}</div>
            <div class="studio-post-item-meta">${lowerPreserveBrand(p.category)} · ${p.date}</div>
          </div>
        `
          )
          .join("");

        postListEl.querySelectorAll(".studio-post-item").forEach((item) => {
          item.addEventListener("click", () => selectPost(item.dataset.slug));
        });
      } catch (e) {}
    }

    async function selectPost(slug) {
      const meta = allPosts.find((p) => p.slug === slug);
      if (!meta) return;
      slugManuallyEdited = true;
      titleEl.value = lowerPreserveBrand(meta.title);
      slugEl.value = meta.slug;
      catEl.value = String(meta.category || "the craft").toLowerCase();
      dateEl.value = meta.date;
      summaryEl.value = lowerPreserveBrand(meta.summary || "");
      openPostLink.style.display = "inline";
      openPostLink.href = "writing/" + encodeURIComponent(slug) + "/";

      try {
        const res = await fetch("posts/" + encodeURIComponent(slug) + ".md?t=" + Date.now());
        bodyEl.value = lowerPreserveBrand(await res.text());
      } catch (e) {
        bodyEl.value = "";
      }
      updatePreview();
    }

    document.getElementById("new-post-btn").addEventListener("click", () => {
      slugManuallyEdited = false;
      titleEl.value = "";
      slugEl.value = "";
      catEl.value = "the craft";
      dateEl.value = new Date().toISOString().slice(0, 10);
      summaryEl.value = "";
      bodyEl.value = "";
      openPostLink.style.display = "none";
      statusEl.textContent = "ready for a new post.";
      updatePreview();
    });

    document.getElementById("publish-btn").addEventListener("click", async () => {
      const title = lowerPreserveBrand(titleEl.value.trim());
      const slug = slugEl.value.trim() || slugify(title);
      const category = lowerPreserveBrand(catEl.value);
      const date = dateEl.value;
      const summary = lowerPreserveBrand(summaryEl.value.trim());
      const content = lowerPreserveBrand(bodyEl.value);

      if (!title || !slug || !content.trim()) {
        statusEl.textContent = "please fill in title and content.";
        return;
      }

      const payload = {
        slug,
        title,
        category,
        date,
        summary,
        readTime: estimateReadTime(content),
        content
      };

      statusEl.textContent = "saving...";
      try {
        const res = await fetch("/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("save failed");
        statusEl.textContent = "published to posts/" + slug + ".md";
        openPostLink.style.display = "inline";
        openPostLink.href = "post.html?slug=" + encodeURIComponent(slug);
        await loadPostList();
      } catch (err) {
        statusEl.textContent = "download .md or ask agent in chat to publish directly to github.";
      }
    });

    document.getElementById("download-md-btn").addEventListener("click", () => {
      const slug = slugEl.value.trim() || "new-post";
      const blob = new Blob([lowerPreserveBrand(bodyEl.value)], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = slug + ".md";
      a.click();
    });

    (async function init() {
      await loadPostList();
      const params = new URLSearchParams(window.location.search);
      const editSlug = params.get("edit");
      if (editSlug) {
        await selectPost(editSlug);
      } else {
        updatePreview();
      }
    })();
  </script>
</body>
</html>
